basePath: /
definitions:
  admin.AdminCreateKelasRequest:
    properties:
      deskripsi:
        type: string
      nama:
        type: string
      tahun_ajaran:
        type: string
      tingkat:
        type: integer
    required:
    - nama
    - tahun_ajaran
    - tingkat
    type: object
  admin.AdminKelasResponse:
    properties:
      deskripsi:
        example: Pemrograman Dasar
        type: string
      dibuat:
        type: string
      guru:
        example: false
        type: boolean
      id:
        example: 1
        type: integer
      kode_kelas:
        example: ABC123
        type: string
      nama:
        example: X PPLG 1
        type: string
      nama_pengampu:
        example: Eko Kusnandar
        type: string
      pengampu:
        example: 2
        type: integer
      tahun_ajaran:
        example: 2026/2027
        type: string
      tingkat:
        example: 10
        type: integer
    type: object
  admin.AdminPenggunaItem:
    properties:
      email:
        example: eko@example.com
        type: string
      id:
        example: 2
        type: integer
      kelas:
        items:
          type: string
        type: array
      nama:
        example: Eko Kusnandar
        type: string
      phone:
        example: "08123456789"
        type: string
      profile_picture:
        example: ""
        type: string
      role:
        example: guru
        type: string
    type: object
  admin.CreateKalenderAgendaRequest:
    properties:
      keterangan:
        type: string
      nama_kegiatan:
        type: string
      tanggal_mulai:
        type: string
      tanggal_selesai:
        type: string
    required:
    - nama_kegiatan
    - tanggal_mulai
    type: object
  admin.KalenderAgendaResponse:
    properties:
      dibuat:
        type: string
      id:
        example: 1
        type: integer
      keterangan:
        example: Pertemuan awal semester
        type: string
      nama_kegiatan:
        example: Rapat Orang Tua
        type: string
      tanggal_mulai:
        example: "2026-11-20"
        type: string
      tanggal_selesai:
        example: "2026-11-21"
        type: string
    type: object
  admin.ListAdminResponse:
    properties:
      admin:
        example: true
        type: boolean
      dibuat:
        example: "2026-01-01T00:00:00Z"
        type: string
      email:
        example: admin@example.com
        type: string
      id:
        example: 1
        type: integer
      nama:
        example: Admin
        type: string
      phone:
        example: "08123456789"
        type: string
      profile_picture:
        example: uploads/pfp/admin.jpg
        type: string
      role:
        example: admin
        type: string
    type: object
  admin.ListGuruMuridResponse:
    properties:
      guru:
        items:
          $ref: '#/definitions/admin.AdminPenggunaItem'
        type: array
      murid:
        items:
          $ref: '#/definitions/admin.AdminPenggunaItem'
        type: array
    type: object
  admin.ListGuruResponse:
    properties:
      kelas_id:
        example: 1
        type: integer
      nama_kelas:
        example: Matematika
        type: string
      nama_pengguna:
        example: Guru Budi
        type: string
      pengguna_id:
        example: 2
        type: integer
    type: object
  admin.UpdateGuruPayload:
    properties:
      role_guru:
        example: true
        type: boolean
    required:
    - role_guru
    type: object
  admin.UpdatePengampuKelasRequest:
    properties:
      pengampu_id:
        type: integer
    type: object
  admin.UpdateRolePenggunaRequest:
    properties:
      penggunaID:
        type: integer
      role:
        type: string
    required:
    - penggunaID
    - role
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
      username:
        example: John Doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.SuccessResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  files.UploadPostinganFilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/files.UploadedPostinganFile'
        type: array
    type: object
  files.UploadedPostinganFile:
    properties:
      nama:
        example: tugas.pdf
        type: string
      path:
        example: /uploads/2026/11/08/9f8e7d6c5b4a39281706f5e4d3c2b1a0.pdf
        type: string
      ukuran:
        example: 102400
        type: integer
    type: object
  kelas.AnggotaKelasResponse:
    properties:
      dibuat:
        example: "2026-11-16T08:00:00Z"
        type: string
      email:
        example: budi@example.com
        type: string
      guru:
        example: false
        type: boolean
      nama:
        example: Budi Santoso
        type: string
      pengguna_id:
        example: 2
        type: integer
      profile_picture:
        example: uploads/pfp/2026/11/10/user2_abc.jpg
        type: string
      role:
        example: murid
        type: string
    type: object
  kelas.CreateKelasRequest:
    properties:
      deskripsi:
        type: string
      nama:
        type: string
      tahun_ajaran:
        type: string
      tingkat:
        type: integer
    required:
    - nama
    - tahun_ajaran
    - tingkat
    type: object
  kelas.ListKelasResponse:
    properties:
      deskripsi:
        example: Belajar algoritma dan struktur data
        type: string
      dibuat:
        example: 2006-01-02T15:04:05Z07:00
        type: string
      guru:
        example: true
        type: boolean
      id:
        example: 2
        type: integer
      kode_kelas:
        example: A18D23
        type: string
      nama:
        example: Pemrograman Dasar
        type: string
      pengampu:
        example: 1
        type: integer
      tahun_ajaran:
        example: 2026/2027
        type: string
      tingkat:
        example: 10
        type: integer
    type: object
  kelas.UpdateKelasPayload:
    properties:
      deskripsi:
        example: Belajar algoritma dan struktur data
        type: string
      nama:
        example: Pemrograman Dasar Lanjutan
        type: string
    type: object
  pengguna.GetPenggunaFailure400Response:
    properties:
      message:
        example: Data pengguna tidak ditemukan
        type: string
    type: object
  pengguna.GetPenggunaFailure401Response:
    properties:
      message:
        example: Tidak dapat mengakses data klaim
        type: string
    type: object
  pengguna.GetPenggunaSuccessResponse:
    properties:
      admin:
        example: false
        type: boolean
      email:
        example: johndoe@example.com
        type: string
      id:
        example: 1
        type: integer
      phone:
        example: "123123123"
        type: string
      profile_picture:
        example: joe_mama.jpg
        type: string
      role:
        example: murid
        type: string
      username:
        example: John Doe
        type: string
    type: object
  pengguna.PenggunaDataResponse:
    properties:
      email:
        example: johndoe@example.com
        type: string
      id:
        example: 1
        type: integer
      nama:
        example: John Doe
        type: string
      phone:
        example: "08123456789"
        type: string
      profile_picture:
        example: uploads/pfp/2026/11/10/user1_abc.jpg
        type: string
    type: object
  pengguna.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  pengguna.UpdateEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  pengguna.UpdatePenggunaResponse:
    properties:
      data:
        $ref: '#/definitions/pengguna.PenggunaDataResponse'
      message:
        example: Data berhasil diperbarui
        type: string
    type: object
  pengguna.UpdatePhoneRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  postingan.CreatePostinganRequest:
    properties:
      deskripsi:
        type: string
      judul:
        type: string
      lampiran:
        items:
          type: string
        type: array
      tipe:
        maximum: 2
        minimum: 1
        type: integer
    required:
    - judul
    - tipe
    type: object
  postingan.EditPostinganRequest:
    properties:
      deskripsi:
        type: string
      judul:
        type: string
      lampiran:
        items:
          type: string
        type: array
      tipe:
        maximum: 2
        minimum: 1
        type: integer
    required:
    - judul
    - tipe
    type: object
  postingan.PengumpulanItemResponse:
    properties:
      dibuat:
        example: "2026-01-01T00:00:00Z"
        type: string
      email:
        example: budi@example.com
        type: string
      id:
        example: 1
        type: integer
      lampiran:
        example:
        - '["/uploads/2026/11/08/abc.pdf"]'
        items:
          type: string
        type: array
      nama:
        example: Budi Santoso
        type: string
      pengguna_id:
        example: 2
        type: integer
      postingan_id:
        example: 1
        type: integer
      profile_picture:
        example: uploads/pfp/2026/11/10/user2_abc.jpg
        type: string
    type: object
  postingan.PengumpulanResponse:
    properties:
      dibuat:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      lampiran:
        example:
        - '["/uploads/2026/11/08/abc.pdf"]'
        items:
          type: string
        type: array
      pengguna_id:
        example: 2
        type: integer
      postingan_id:
        example: 1
        type: integer
      submitted:
        example: true
        type: boolean
    type: object
  postingan.PostinganResponse:
    properties:
      deskripsi:
        example: Pelajari materi berikut
        type: string
      dibuat:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      judul:
        example: Materi Bab 1
        type: string
      kelas_id:
        example: 1
        type: integer
      lampiran:
        example:
        - '["/uploads/2026/11/08/abc.pdf"]'
        items:
          type: string
        type: array
      pengguna_id:
        example: 1
        type: integer
      tipe_id:
        example: 1
        type: integer
    type: object
  postingan.SubmitPengumpulanRequest:
    properties:
      lampiran:
        items:
          type: string
        type: array
    type: object
  postingan.TarikPengumpulanResponse:
    properties:
      lampiran:
        example:
        - '["/uploads/2026/11/08/abc.pdf"]'
        items:
          type: string
        type: array
      message:
        example: Pengumpulan tugas berhasil ditarik
        type: string
    type: object
  postingan.TipePostinganResponse:
    properties:
      id:
        example: 1
        type: integer
      nama:
        example: Materi
        type: string
    type: object
  utils.HTTPResponse:
    properties:
      message:
        type: string
    type: object
host: api.pathclass.app
info:
  contact: {}
  description: This is documentation for PATH API.
  license:
    name: Apache 2.0
    url: https://raw.githubusercontent.com/kelompokms/path-api/refs/heads/main/LICENSE
  title: PATH API Documentation
  version: "1.0"
paths:
  /{kode_kelas}/guru:
    patch:
      consumes:
      - application/json
      description: Mengupdate status role guru pengguna pada kelas tertentu
      parameters:
      - description: Kode Kelas
        in: path
        name: kode_kelas
        required: true
        type: string
      - description: Update Guru Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateGuruPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Update Role Guru
      tags:
      - Admin
  /admin:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar semua admin
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.ListAdminResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: List Admin
      tags:
      - Admin
  /admin/kalender/agenda:
    post:
      consumes:
      - application/json
      description: Menambahkan satu kegiatan kalender akademik beserta keterangan
        agar dapat dilihat semua pengguna (khusus admin)
      parameters:
      - description: Agenda Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.CreateKalenderAgendaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.KalenderAgendaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Tambah Agenda Kalender Akademik
      tags:
      - Admin
  /admin/kelas:
    get:
      description: Mendapatkan daftar seluruh kelas sekolah dengan filter tahun_ajaran,
        tingkat, dan nama (khusus admin)
      parameters:
      - description: Filter tahun ajaran
        in: query
        name: tahun_ajaran
        type: string
      - description: Filter tingkat kelas
        in: query
        name: tingkat
        type: integer
      - description: Filter nama kelas
        in: query
        name: nama
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.AdminKelasResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: List Semua Kelas (Admin)
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Membuat satu kelas baru dengan pengampu default null (khusus admin)
      parameters:
      - description: Data kelas baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AdminCreateKelasRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Buat Kelas Manual (Admin)
      tags:
      - Admin
  /admin/kelas/{kode_kelas}/pengampu:
    patch:
      consumes:
      - application/json
      description: Menetapkan atau mengubah pengampu utama kelas dari daftar pengguna
        ber-role guru (khusus admin)
      parameters:
      - description: Kode Kelas
        in: path
        name: kode_kelas
        required: true
        type: string
      - description: ID guru pengampu (null untuk mengosongkan)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdatePengampuKelasRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Ubah Pengampu Kelas (Admin)
      tags:
      - Admin
  /admin/kelas/csv:
    post:
      consumes:
      - multipart/form-data
      description: 'Mengunggah file CSV (kolom: nama,tingkat,tahun_ajaran,deskripsi)
        untuk membuat banyak kelas dengan pengampu default null (khusus admin)'
      parameters:
      - description: File CSV daftar kelas
        in: formData
        name: file_csv
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Buat Banyak Kelas dari CSV (Admin)
      tags:
      - Admin
  /admin/pengguna:
    get:
      description: Mendapatkan daftar semua guru dan murid beserta kelas terkait (khusus
        admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ListGuruMuridResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: List Semua Guru dan Murid
      tags:
      - Admin
  /admin/pengguna/{pengguna_id}/role:
    patch:
      consumes:
      - application/json
      description: Mengubah role universal pengguna antara guru dan murid pada tabel
        role_pengguna (khusus admin)
      parameters:
      - description: ID Pengguna
        in: path
        name: pengguna_id
        required: true
        type: integer
      - description: Role baru (guru atau murid)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateRolePenggunaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Ubah Role Pengguna (Guru/Murid)
      tags:
      - Admin
  /auth/oauth/{provider}:
    get:
      description: Mengalihkan pengguna ke halaman persetujuan OAuth2 provider (google
        atau discord) dengan PKCE dan state cookie bertanda tangan
      parameters:
      - description: OAuth provider (google, discord)
        in: path
        name: provider
        required: true
        type: string
      - description: URL redirect tujuan yang diizinkan (mis. pathmobile://app/oauth/callback)
        in: query
        name: redirect_uri
        type: string
      - description: Nonce state anti-CSRF dari aplikasi mobile (16-128 karakter URL-safe)
        in: query
        name: client_state
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect ke halaman login OAuth provider
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Inisiasi login OAuth2
      tags:
      - Auth
  /auth/oauth/{provider}/callback:
    get:
      description: Menukar authorization code dari OAuth2 provider dengan data profil
        terverifikasi, menautkan atau membuat akun pengguna, lalu mengembalikan JWT
        token atau redirect ke target yang diizinkan
      parameters:
      - description: OAuth provider (google, discord)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code dari OAuth provider
        in: query
        name: code
        required: true
        type: string
      - description: State token anti-CSRF
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SuccessResponse'
        "302":
          description: Redirect ke frontend/mobile dengan token
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "503":
